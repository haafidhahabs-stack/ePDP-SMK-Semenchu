<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Aplikasi e-PDP SMK Semenchu</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

.header{
background:#1b5e20;
color:white;
padding:15px;
text-align:center;
font-size:20px;
}

.container{
padding:15px;
}

select,button{
width:100%;
padding:12px;
font-size:16px;
margin-top:10px;
}

#reader{
width:100%;
margin-top:20px;
}

.option{
margin-top:10px;
}

</style>

</head>


<body>

<div class="header">
Aplikasi e-PDP SMK Semenchu
</div>

<div class="container">

<select id="guru">
<option value="">-- Pilih Nama Guru --</option>
</select>

<div class="option">
<input type="checkbox" id="gantian">
<label>Mod Gantian (Pilih Masa Manual)</label>
</div>

<div class="option">
<input type="radio" name="masa" value="30" checked>30 min
<input type="radio" name="masa" value="60">60 min
<input type="radio" name="masa" value="90">90 min
</div>

<div id="reader"></div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbwNhDgO6VCUC3Vb2JmJZtFVdQfhNtIMGdseFcpsKZhzF1GOUo04f3mxAYne40RZZCjJNQ/exec";

let lastScanTime=0;



/* LOAD NAMA GURU */

async function loadGuru(){

const res=await fetch(API_URL+"?action=guru");

const data=await res.json();

const list=data.guru;

const select=document.getElementById("guru");

list.forEach(n=>{

const option=document.createElement("option");

option.value=n;

option.text=n;

select.appendChild(option);

});

}

loadGuru();





function onScanSuccess(decodedText){

let now=Date.now();

if(now-lastScanTime<3000){
return;
}

lastScanTime=now;


let guru=document.getElementById("guru").value;

if(!guru){
alert("Sila pilih nama guru dahulu");
return;
}



let parts=decodedText.split("|");

let jenis="";
let kelas=decodedText;

if(parts.length>1){

if(parts[0]=="RELIF"){
jenis="RELIF";
}

kelas=parts[1];

}



let masa=document.querySelector('input[name="masa"]:checked').value;

let bil=masa/30;



const payload={

guru:guru,
kelas:kelas,
slot:masa,
bil:bil,
jenis:jenis

};



fetch(API_URL,{
method:"POST",
body:JSON.stringify(payload)
})
.then(r=>r.json())
.then(res=>{

if(res.ok){

navigator.vibrate(200);

alert("Berjaya Scan");

}

});

}





const html5QrCode=new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devices=>{

let cameraId=devices[devices.length-1].id;

html5QrCode.start(

cameraId,
{
fps:10,
qrbox:250
},
onScanSuccess

);

});

</script>

</body>
</html>

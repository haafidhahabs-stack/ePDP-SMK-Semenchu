<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aplikasi e-PDP SMK Semenchu</title>

<script src="html5-qrcode.min.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Poppins,sans-serif;
background:#d9f4e0;
height:100vh;
display:flex;
flex-direction:column;
}

.header{
background:#1b5e20;
color:white;
text-align:center;
padding:14px;
font-weight:bold;
font-size:18px;
}

.controls{
background:white;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
}

select{
padding:10px;
font-size:15px;
border-radius:8px;
border:1px solid #ccc;
}

.options{
display:flex;
gap:12px;
align-items:center;
}

#reader{
flex:1;
width:100%;
}

.successFlash{
animation:flash 0.4s;
}

@keyframes flash{
0%{background:#2e7d32;}
100%{background:#d9f4e0;}
}

</style>
</head>

<body>

<div class="header">
Aplikasi e-PDP SMK Semenchu
</div>

<div class="controls">

<select id="guru">
<option value="">Loading nama guru...</option>
</select>

<label>
<input type="checkbox" id="gantian">
Mod Gantian (Pilih Masa Manual)
</label>

<div class="options">
<label><input type="radio" name="durasi" value="1" checked>30 min</label>
<label><input type="radio" name="durasi" value="2">60 min</label>
<label><input type="radio" name="durasi" value="3">90 min</label>
</div>

</div>

<div id="reader"></div>

<script>

/* ================= CONFIG ================= */

const API_URL="https://script.google.com/macros/s/AKfycbwNhDgO6VCUC3Vb2JmJZtFVdQfhNtIMGdseFcpsKZhzF1GOUo04f3mxAYne40RZZCjJNQ/exec";

let scanner;
let scanLock=false;

/* ================= LOAD GURU ================= */

fetch(API_URL+"?guru=1")
.then(r=>r.json())
.then(list=>{
const select=document.getElementById("guru");
select.innerHTML='<option value="">-- Pilih Nama Guru --</option>';

list.forEach(n=>{
let opt=document.createElement("option");
opt.value=n;
opt.textContent=n;
select.appendChild(opt);
});
});

/* ================= AUTO SLOT ================= */

function autoSlot(){

const now=new Date();
const start=7*60+20;
const min=now.getHours()*60+now.getMinutes();

let slot=Math.floor((min-start)/30)+1;

if(slot<1)slot=1;
if(slot>13)slot=13;

return slot;
}

/* ================= SCAN SUCCESS ================= */

function onScanSuccess(text){

if(scanLock) return;
scanLock=true;

const guru=document.getElementById("guru").value;
if(!guru){
alert("Sila pilih nama guru dahulu");
scanLock=false;
return;
}

let kelas=text;
let jenis="";

if(text.startsWith("RELIF|")){
jenis="RELIF";
kelas=text.replace("RELIF|","");
}

const bil=document.querySelector('input[name="durasi"]:checked').value;

const data={
guru:guru,
kelas:kelas,
slot:autoSlot(),
bil:parseInt(bil),
jenis:jenis
};

fetch(API_URL,{
method:"POST",
body:JSON.stringify(data)
})
.then(r=>r.json())
.then(res=>{

if(res.ok){

if(navigator.vibrate) navigator.vibrate(200);

alert("✅ Berjaya Scan\n"+kelas);

document.body.classList.add("successFlash");
setTimeout(()=>document.body.classList.remove("successFlash"),400);

}

setTimeout(()=>scanLock=false,2000);

});

}

/* ================= START CAMERA ================= */

function startScanner(){

scanner=new Html5Qrcode("reader");

scanner.start(
{facingMode:"environment"},
{
fps:10,
qrbox:{width:260,height:260}
},
onScanSuccess
);

}

document.addEventListener("DOMContentLoaded",startScanner);

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi e-PDP SMK Semenchu</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
}

.header{
background:#1b5e20;
color:white;
text-align:center;
padding:15px;
font-size:18px;
}

.container{
padding:15px;
}

select{
width:100%;
padding:10px;
font-size:16px;
margin-top:10px;
}

#reader{
margin-top:15px;
}

.success{
background:#4caf50;
color:white;
padding:12px;
text-align:center;
display:none;
margin-top:10px;
border-radius:6px;
}

.radio{
margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
Aplikasi e-PDP SMK Semenchu
</div>

<div class="container">

<select id="namaGuru">
<option value="">-- Pilih Nama Guru --</option>
</select>

<br>

<label>
<input type="checkbox" id="modGantian">
Mod Gantian (Pilih Masa Manual)
</label>

<div class="radio">

<label><input type="radio" name="masa" value="30" checked>30 min</label>

<label><input type="radio" name="masa" value="60">60 min</label>

<label><input type="radio" name="masa" value="90">90 min</label>

</div>

<div id="reader"></div>

<div id="notif" class="success">
Berjaya Scan ✅
</div>

</div>

<script>


const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNhDgO6VCUC3Vb2JmJZtFVdQfhNtIMGdseFcpsKZhzF1GOUo04f3mxAYne40RZZCjJNQ/exec";


// ================= LOAD NAMA GURU =================

async function loadGuru(){

try{

const response = await fetch(SCRIPT_URL + "?mode=guru");

const data = await response.json();

const select = document.getElementById("namaGuru");

select.innerHTML='<option value="">-- Pilih Nama Guru --</option>';

const list = data.guru;

if(!Array.isArray(list)){

console.log("Data guru bukan array");

return;

}

list.forEach(function(nama){

const option=document.createElement("option");

option.value=nama;

option.textContent=nama;

select.appendChild(option);

});

}

catch(error){

console.log("Error load guru:",error);

}

}

window.onload=loadGuru;



// ================= SCAN SUCCESS =================

function onScanSuccess(decodedText){

const guru=document.getElementById("namaGuru").value;

if(!guru){

alert("Sila pilih nama guru dahulu");

return;

}

let kelas=decodedText;

let jenis="";

if(decodedText.includes("RELIF")){

jenis="RELIF";

kelas=decodedText.replace("RELIF|","");

}


const masa=document.querySelector('input[name="masa"]:checked').value;

const bil=masa/30;


const payload={

guru:guru,

kelas:kelas,

slot:masa,

bil:bil,

jenis:jenis

};


fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify(payload)

})

.then(res=>res.json())

.then(data=>{

document.getElementById("notif").style.display="block";

if(navigator.vibrate){

navigator.vibrate(200);

}

setTimeout(function(){

document.getElementById("notif").style.display="none";

},2000);

})

.catch(err=>console.log(err));

}



// ================= START CAMERA =================

const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devices=>{

if(devices && devices.length){

html5QrCode.start(

devices[0].id,

{

fps:10,

qrbox:250

},

onScanSuccess

);

}

});

</script>

</body>
</html>

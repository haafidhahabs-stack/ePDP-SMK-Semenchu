<!DOCTYPE html>
<html lang="ms">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi e-PDP SMK Semenchu</title>

<script src="html5-qrcode.min.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
height:100%;
font-family:Poppins,sans-serif;
background:#d9f4e0;
overflow:hidden;
}

.container{
display:flex;
flex-direction:column;
height:100%;
}

.header{
background:#1b5e20;
color:#fff;
text-align:center;
padding:12px;
font-size:18px;
font-weight:bold;
}

.controls{
background:#fff;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
}

select{
width:100%;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

.options{
display:flex;
gap:15px;
flex-wrap:wrap;
}

#reader{
flex:1;
width:100%;
}

.success{
background:#2e7d32 !important;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
Aplikasi e-PDP SMK Semenchu
</div>

<div class="controls">

<select id="guru"></select>

<label>
<input type="checkbox" id="gantian">
Mod Gantian (Pilih Masa Manual)
</label>

<div class="options">
<label><input type="radio" name="durasi" value="1" checked>30 min</label>
<label><input type="radio" name="durasi" value="2">60 min</label>
<label><input type="radio" name="durasi" value="3">90 min</label>
</div>

</div>

<div id="reader"></div>

</div>

<script>

/* ================= SENARAI GURU KEKAL ================= */

const SENARAI_GURU = [

"HJ. AMAD BAHRI BIN MARDI",
"SITI SANISAH BINTI SAMIAN",
"MOHD JAMIL BIN SALEH @ JAPRI",
"HUZANA BINTI SARIJO",
"FATIMAH ZOHORA BINTI NOH",
"ZURAINI BINTI AHMAD",
"ANIZA BINTI AHMAD",
"JOHARI BIN JAMAT",
"ALINA BINTI RAHMAN",
"AHMAD FAHIM NAQIUDDIN BIN IBRAHIM",
"FARIHAH AQILAH BINTI MOHD YAINI",
"HAAFIDHAH BINTI ABU BAKAR SIDEK",
"HANANI BINTI MAT HUSIN",
"HANIDA BINTI SHAABAN",
"HASLINA BINTI ZAKARIA",
"HJH JUHANA BINTI JAFFAR",
"KHADIJAH BINTI M. YUSUF",
"MASSURA BINTI SIRAT",
"MOHAMAD AMRAN BIN JASMANI",
"MOHAMMAD JUNAIDI BIN SUWADI",
"MOHD FARID BIN DAWAM",
"MOHD HISHAMUDDIN BIN MD BASAR",
"MUHAMMAD ALHAKIM BIN MUSTAFA",
"MUHAMMAD FIKRI BIN ABD RAHMAN",
"NOOR ADILAH BINTI FAUZI",
"NOOR AZMIL BIN MISMAN",
"NOOR FADZILLA ROZIETA BINTI HOSNIN",
"NOOR NASRIN FARHAH BINTI SURIF",
"NOORFARRAWATI BINTI MOHD HALIL",
"NOR HAMIDA BINTI JUSOH",
"NOREHAN BINTI SUJAICE",
"NORFAIZAH BINTI ISNIN",
"NORHAZLIN BINTI MAHAD",
"NORLIDA BINTI HASHIM",
"NORLIZA BINTI OTHMAN",
"NUR NAJIHAH BT MOHD SAH",
"NUR SHAFIQAH BINTI MOHAMAD",
"NURADILAH BINTI KOSNAN",
"NURAINI ABDUL RAZAK",
"NURELISA FARAHIM BINTI ABDUL HADI",
"NURFARIZA BINTI MOHAMAD SHAH",
"NURUL AIN BINTI BAHIR",
"NURUL ASHIKIN BINTI BAHAROM",
"NURUL NADHIRAH BINTI AHMAD SHUKRI",
"NURUL NAZURAH BINTI NORHISAM",
"NURULHUDA BINTI RAHIM",
"RAHAYU BINTI SULAIMAN",
"ROSHALIZA BINTI ROMLI",
"ROSLI BIN ABU AMIN",
"ROSLINAH BINTI PARHAN",
"SAFRY BIN SALLEH",
"SALINA BINTI KHAMIS",
"SITI HALINA BINTI JAMHARI",
"SITI NOR KHAMLEZA BINTI TAMIN",
"SUZANAH BINTI KASON",
"SUZILA BINTI ABDULLAH",
"UMAR FARUQ BIN MOHD ISMAIL"

];

/* ================= LOAD DROPDOWN ================= */

const guruSelect=document.getElementById("guru");

guruSelect.innerHTML='<option value="">-- Pilih Nama Guru --</option>';

SENARAI_GURU.forEach(n=>{
let opt=document.createElement("option");
opt.value=n;
opt.textContent=n;
guruSelect.appendChild(opt);
});

/* ================= CONFIG ================= */

const API_URL="https://script.google.com/macros/s/AKfycbwNhDgO6VCUC3Vb2JmJZtFVdQfhNtIMGdseFcpsKZhzF1GOUo04f3mxAYne40RZZCjJNQ/exec";

/* ================= SLOT AUTO ================= */

function autoDetectSlot(){

const now=new Date();
const total=now.getHours()*60+now.getMinutes();
const start=7*60+30;

let slot=Math.floor((total-start)/30)+1;

if(slot<1)slot=1;
if(slot>15)slot=15;

return slot;
}

/* ================= SCAN SUCCESS ================= */

function onScanSuccess(msg){

let jenis="NORMAL";
let kelas=msg;

if(msg.includes("|")){
let p=msg.split("|");
jenis=p[0];
kelas=p[1];
}

const guru=guruSelect.value;

if(!guru){
alert("Sila pilih nama guru dahulu");
return;
}

const bil=document.querySelector('input[name="durasi"]:checked').value;

const mod=document.getElementById("gantian").checked
? "GANTIAN"
: jenis;

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
guru:guru,
kelas:kelas,
slot:autoDetectSlot(),
bil:parseInt(bil),
jenis:mod
})
})
.then(r=>r.json())
.then(res=>{

if(res.ok){
navigator.vibrate(200);
document.body.classList.add("success");
setTimeout(()=>document.body.classList.remove("success"),600);
}

});

}

function onScanError(){}

/* ================= CAMERA ================= */

async function startScanner(){

const scanner=new Html5Qrcode("reader");

const cams=await Html5Qrcode.getCameras();

if(!cams.length){
alert("Tiada kamera");
return;
}

let back=cams.find(c=>
c.label.toLowerCase().includes("back")||
c.label.toLowerCase().includes("rear")
);

await scanner.start(
back?back.id:cams[0].id,
{
fps:10,
qrbox:(w,h)=>{
let m=Math.min(w,h);
return Math.floor(m*0.75);
}
},
onScanSuccess,
onScanError
);

}

startScanner();

</script>

</body>
</html>

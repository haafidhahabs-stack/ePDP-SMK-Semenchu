<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi e-PDP SMK Semenchu</title>

<script src="html5-qrcode.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
height:100%;
font-family:Poppins, sans-serif;
background:#d9f4e0;
overflow:hidden;
}

.container{
display:flex;
flex-direction:column;
height:100%;
}

.header{
background:#1b5e20;
color:white;
text-align:center;
padding:14px;
font-size:18px;
font-weight:bold;
}

.controls{
background:white;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
}

select{
width:100%;
padding:10px;
font-size:14px;
border-radius:6px;
border:1px solid #ccc;
}

.small-text{
font-size:12px;
color:#555;
}

#slotManual{
display:none;
}

#reader{
flex:1;
width:100%;
}

.success{
background:#2e7d32 !important;
}
</style>
</head>
<body>

<div class="container">

<div class="header">
Aplikasi e-PDP SMK Semenchu
</div>

<div class="controls">

<select id="guru"></select>

<label>
<input type="checkbox" id="gantian">
Mod Gantian (Lupa key-in)
</label>

<select id="slotManual"></select>

<div>
<label><input type="radio" name="durasi" value="1" checked> 30 min</label>
<label><input type="radio" name="durasi" value="2"> 60 min</label>
<label><input type="radio" name="durasi" value="3"> 90 min</label>
</div>

<div class="small-text">
Slot auto ikut masa semasa jika Mod Gantian tidak ditanda.
</div>

</div>

<div id="reader"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwNhDgO6VCUC3Vb2JmJZtFVdQfhNtIMGdseFcpsKZhzF1GOUo04f3mxAYne40RZZCjJNQ/exec";

let html5QrCode;

/* ================= LOAD GURU ================= */

async function loadGuru(){
try{
    const res = await fetch(API_URL);
    const data = await res.json();
    const select = document.getElementById("guru");

    select.innerHTML = '<option value="">-- Pilih Nama Guru --</option>';

    data.guru.forEach(nama=>{
        const opt = document.createElement("option");
        opt.value = nama;
        opt.textContent = nama;
        select.appendChild(opt);
    });

}catch(e){
    console.error("Gagal load guru", e);
}
}

/* ================= SLOT AUTO ================= */

function autoDetectSlot(){
const now = new Date();
const totalMin = now.getHours()*60 + now.getMinutes();
const start = 7*60+30;

let slot = Math.floor((totalMin - start)/30)+1;
if(slot < 1) slot = 1;
if(slot > 15) slot = 15;
return slot;
}

/* ================= SLOT MANUAL ================= */

function generateSlotManual(){
const select = document.getElementById("slotManual");
select.innerHTML = "";

for(let i=1;i<=15;i++){
    let opt = document.createElement("option");
    opt.value = i;
    opt.textContent = "Slot " + i;
    select.appendChild(opt);
}
}

/* ================= SCAN SUCCESS ================= */

function onScanSuccess(qrMessage){

const guru = document.getElementById("guru").value;
if(!guru){
alert("Sila pilih nama guru dahulu");
return;
}

const bil = parseInt(document.querySelector('input[name="durasi"]:checked').value);
const gantian = document.getElementById("gantian").checked;

const slot = gantian
? parseInt(document.getElementById("slotManual").value)
: autoDetectSlot();

const data = {
kelas: qrMessage,
slot: slot,
bil: bil,
jenis: gantian ? "GANTI" : ""
};

fetch(API_URL,{
method:"POST",
body:JSON.stringify(data)
})
.then(r=>r.json())
.then(res=>{
if(res.ok){
navigator.vibrate(200);
document.body.classList.add("success");
setTimeout(()=>document.body.classList.remove("success"),500);
}
});

}

/* ================= START CAMERA ================= */

async function startCamera(){

try{
    const devices = await Html5Qrcode.getCameras();
    if(!devices.length){
        alert("Tiada kamera dijumpai");
        return;
    }

    let backCam = devices.find(d =>
        d.label.toLowerCase().includes("back") ||
        d.label.toLowerCase().includes("rear")
    );

    const cameraId = backCam ? backCam.id : devices[0].id;

    html5QrCode = new Html5Qrcode("reader");

    await html5QrCode.start(
        cameraId,
        {
            fps:10,
            qrbox:(w,h)=>{
                let min = Math.min(w,h);
                return Math.floor(min*0.75);
            }
        },
        onScanSuccess
    );

}catch(err){
    console.error(err);
    alert("Gagal buka kamera");
}

}

/* ================= INIT ================= */

document.getElementById("gantian").addEventListener("change",function(){
document.getElementById("slotManual").style.display =
this.checked ? "block" : "none";
});

document.addEventListener("DOMContentLoaded",async function(){
generateSlotManual();
await loadGuru();
startCamera();
});

</script>

</body>
</html>

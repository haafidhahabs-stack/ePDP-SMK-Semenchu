<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwBDsXaUXgFMTFegyB_07CVrRxq02BB8R4_S8rolEYDkNSHiYvvHmUoywgZ0twnpzVzCw/exec";

let html5QrCode;
let cameras = [];
let currentCameraIndex = 0;

function autoDetectSlot(){
const now = new Date();
const hour = now.getHours();
const min = now.getMinutes();
const totalMin = hour*60 + min;
const start = 7*60+30;
let slot = Math.floor((totalMin - start)/30)+1;
if(slot < 1) slot = 1;
if(slot > 15) slot = 15;
return slot;
}

function onScanSuccess(qrMessage){

const guru = document.getElementById("guru").value;
if(!guru){
alert("Sila pilih nama guru dahulu");
return;
}

const durasi = parseInt(document.querySelector('input[name="durasi"]:checked').value);
const gantianAktif = document.getElementById("gantian").checked;

let slot = gantianAktif
? parseInt(document.getElementById("slotManual").value)
: autoDetectSlot();

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
kelas: qrMessage,
slot: slot,
bil: durasi,
jenis: gantianAktif ? "GANTIAN" : ""
})
})
.then(r=>r.json())
.then(res=>{
if(res.ok){
navigator.vibrate(200);
document.body.classList.add("success");
setTimeout(()=>document.body.classList.remove("success"),500);
}
});

}

function startScanner(){

Html5Qrcode.getCameras().then(devices => {

cameras = devices;

if(!cameras.length){
alert("Tiada kamera dijumpai");
return;
}

/* pilih kamera belakang jika ada */
let backIndex = cameras.findIndex(cam =>
cam.label.toLowerCase().includes("back") ||
cam.label.toLowerCase().includes("rear")
);

currentCameraIndex = backIndex !== -1 ? backIndex : 0;

html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
cameras[currentCameraIndex].id,
{
fps:10,
qrbox:(w,h)=>Math.floor(Math.min(w,h)*0.75)
},
onScanSuccess
);

});

}

document.addEventListener("DOMContentLoaded", function(){

document.getElementById("gantian").addEventListener("change",function(){
document.getElementById("slotManual").style.display =
this.checked ? "block" : "none";
});

document.getElementById("switchCam").addEventListener("click", async function(){

if(!cameras.length) return;

await html5QrCode.stop();

currentCameraIndex =
(currentCameraIndex+1) % cameras.length;

await html5QrCode.start(
cameras[currentCameraIndex].id,
{
fps:10,
qrbox:(w,h)=>Math.floor(Math.min(w,h)*0.75)
},
onScanSuccess
);

});

startScanner();

});

</script>

<!DOCTYPE html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Aplikasi e-PDP SMK Semenchu</title>
<script src="html5-qrcode.min.js"></script>
<style>body{margin:0;font-family:Poppins, sans-serif;background:#d9f4e0;}
.header{background:#1b5e20;color:white;text-align:center;padding:12px;font-weight:bold;}
.controls{background:white;padding:12px;}
select{width:100%;padding:10px;margin-bottom:10px;}
#reader{width:100%;height:65vh;}
.success{background:#2e7d32!important;}</style></head>
<body>
<div class="header">Aplikasi e-PDP SMK Semenchu</div>
<div class="controls">
<select id="guru"><option>Memuatkan nama guru...</option></select>
<label><input type="checkbox" id="gantian">Mod Gantian (Pilih Masa Manual)</label>
<div id="manualBox" style="display:none;margin-top:8px;"><label><input type="radio" name="durasi" value="1" checked>30 min</label><label><input type="radio" name="durasi" value="2">60 min</label><label><input type="radio" name="durasi" value="3">90 min</label></div>
</div>
<div id="reader"></div>
<script>
/* ================= CONFIG ================= */
const API_URL ="https://script.google.com/macros/s/AKfycbwNhDgO6VCUC3Vb2JmJZtFVdQfhNtIMGdseFcpsKZhzF1GOUo04f3mxAYne40RZZCjJNQ/exec";
/* ================= LOAD GURU ================= */
async function loadGuru(){const res = await fetch(API_URL+"?mode=guru");const list = await res.json();
const select=document.getElementById("guru");select.innerHTML='<option value="">-- Pilih Nama Guru --</option>';
list.forEach(n=>{let opt=document.createElement("option");opt.value=n;opt.textContent=n;select.appendChild(opt);});}
loadGuru();
/* ================= UI ================= */
document.getElementById("gantian").onchange=()=>{document.getElementById("manualBox").style.display=document.getElementById("gantian").checked?"block":"none";};
/* ================= SLOT AUTO ================= */
function autoSlot(){const now=new Date();const start=7*60+30;const total=now.getHours()*60+now.getMinutes();let slot=Math.floor((total-start)/30)+1;if(slot<1)slot=1;if(slot>15)slot=15;return slot;}
/* ================= QR SCANNER ================= */
let scanner;let scanLock=false;
function startScanner(){
scanner=new Html5Qrcode("reader");
scanner.start({ facingMode:"environment" },{fps:10,qrbox:{width:250,height:250}},onScanSuccess);
}
async function onScanSuccess(text){
if(scanLock) return;scanLock=true;
const guru=document.getElementById("guru").value;if(!guru){alert("Sila pilih nama guru dahulu");scanLock=false;return;}
let jenis="";if(text.startsWith("RELIF|")){jenis="RELIF";text=text.replace("RELIF|","");}
const bil=document.querySelector('input[name="durasi"]:checked').value;
const data={guru:guru,kelas:text,slot:autoSlot(),bil:parseInt(bil),jenis:jenis};
await fetch(API_URL,{method:"POST",body:JSON.stringify(data)});
navigator.vibrate?.(200);
document.body.classList.add("success");setTimeout(()=>{document.body.classList.remove("success");scanLock=false;},1500);
}
/* ================= START ================= */
startScanner();
</script>
</body></html>

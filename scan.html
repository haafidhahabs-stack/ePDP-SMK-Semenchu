<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi e-PDP SMK Semenchu</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
}

.header{
background:#1b5e20;
color:white;
text-align:center;
padding:15px;
font-size:18px;
}

.container{
padding:15px;
}

select{
width:100%;
padding:10px;
font-size:16px;
margin-top:10px;
}

#reader{
margin-top:15px;
}

.success{
background:#4caf50;
color:white;
padding:12px;
text-align:center;
display:none;
margin-top:10px;
border-radius:6px;
}

button{
margin-top:10px;
padding:10px;
width:100%;
font-size:16px;
}

.radio{
margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
Aplikasi e-PDP SMK Semenchu
</div>

<div class="container">

<select id="namaGuru">
<option value="">-- Pilih Nama Guru --</option>
</select>

<br>

<label>
<input type="checkbox" id="modGantian">
Mod Gantian (Pilih Masa Manual)
</label>

<div id="slotManual" style="display:none">

<select id="slotSelect"></select>

</div>

<div class="radio">

<label><input type="radio" name="masa" value="1" checked>30 min</label>
<label><input type="radio" name="masa" value="2">60 min</label>
<label><input type="radio" name="masa" value="3">90 min</label>

</div>

<div id="reader"></div>

<div id="notif" class="success"></div>

<button id="padamBtn" style="display:none;">Padam Scan Ini</button>

</div>

<script>

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwNhDgO6VCUC3Vb2JmJZtFVdQfhNtIMGdseFcpsKZhzF1GOUo04f3mxAYne40RZZCjJNQ/exec";

let lastScan="";
let scanLock=false;
let lastScanID="";
let kelasSemasa="";



// ================= LOAD NAMA GURU =================

async function loadGuru(){

const res=await fetch(SCRIPT_URL+"?mode=guru");
const data=await res.json();

const select=document.getElementById("namaGuru");

select.innerHTML='<option value="">-- Pilih Nama Guru --</option>';

data.guru.forEach(function(n){

const option=document.createElement("option");

option.value=n;
option.textContent=n;

select.appendChild(option);

});

}

window.onload=loadGuru;



// ================= SLOT PERDANA =================

function getSlotPerdana(){

const now=new Date();

let start=new Date();

start.setHours(7);
start.setMinutes(30);
start.setSeconds(0);

let diff=(now-start)/60000;

let slot=Math.floor(diff/30)+1;

if(slot<1) slot=1;
if(slot>15) slot=15;

return slot;

}



// ================= SLOT PPKI =================

function getSlotPPKI(){

const jadual=[

"07:20","07:50","08:20","08:50",
"09:20","09:50","10:20","10:50",
"11:20","11:50","12:20","12:50",
"13:20","13:50"

];

const now=new Date();

let current=now.getHours()*60+now.getMinutes();

let slot=1;

for(let i=0;i<jadual.length;i++){

let t=jadual[i].split(":");

let min=parseInt(t[0])*60+parseInt(t[1]);

if(current>=min){
slot=i+1;
}

}

return slot;

}



// ================= SLOT MANUAL =================

function loadSlotManual(){

let list=[];

if(kelasSemasa.includes("PPKI")){

list=[

"7.20 - 7.50",
"7.50 - 8.20",
"8.20 - 8.50",
"8.50 - 9.20",
"9.20 - 9.50",
"9.50 - 10.20",
"10.20 - 10.50",
"10.50 - 11.20",
"11.20 - 11.50",
"11.50 - 12.20",
"12.20 - 12.50",
"12.50 - 1.20",
"1.20 - 1.50",
"1.50 - 2.20"

];

}else{

list=[

"7.30 - 8.00",
"8.00 - 8.30",
"8.30 - 9.00",
"9.00 - 9.30",
"9.30 - 10.00",
"10.00 - 10.30",
"10.30 - 11.00",
"11.00 - 11.30",
"11.30 - 12.00",
"12.00 - 12.30",
"12.30 - 1.00",
"1.00 - 1.30",
"1.30 - 2.00",
"2.00 - 2.30",
"2.30 - 3.00"

];

}

const select=document.getElementById("slotSelect");

select.innerHTML="";

list.forEach(function(masa,i){

let opt=document.createElement("option");

opt.value=i+1;
opt.textContent=masa;

select.appendChild(opt);

});

}



// ================= MOD GANTIAN =================

document.getElementById("modGantian").addEventListener("change",function(){

if(this.checked){

document.getElementById("slotManual").style.display="block";
loadSlotManual();

}else{

document.getElementById("slotManual").style.display="none";

}

});



// ================= SCAN SUCCESS =================

function onScanSuccess(decodedText){

if(scanLock) return;

scanLock=true;

const guru=document.getElementById("namaGuru").value;

if(!guru){

alert("Sila pilih nama guru dahulu");

scanLock=false;

return;

}

let kelas=decodedText;
let jenis="";

if(decodedText.includes("RELIF")){

jenis="RELIF";
kelas=decodedText.replace("RELIF|","");

}

kelasSemasa=kelas;

let slot=0;

if(document.getElementById("modGantian").checked){

slot=parseInt(document.getElementById("slotSelect").value);

}else{

if(kelas.includes("PPKI")){
slot=getSlotPPKI();
}else{
slot=getSlotPerdana();
}

}

let bil=parseInt(document.querySelector('input[name="masa"]:checked').value);

const payload={

guru:guru,
kelas:kelas,
slot:slot,
bil:bil,
jenis:jenis

};

fetch(SCRIPT_URL,{

method:"POST",
body:JSON.stringify(payload)

})
.then(res=>res.json())
.then(data=>{

lastScanID=data.id;

document.getElementById("notif").innerHTML=

"✔ BERJAYA SCAN<br><br>"+
"Guru : "+guru+"<br>"+
"Kelas : "+kelas+"<br>"+
"Slot : "+slot;

document.getElementById("notif").style.display="block";

document.getElementById("padamBtn").style.display="block";

if(navigator.vibrate){
navigator.vibrate(200);
}

setTimeout(function(){
document.getElementById("padamBtn").style.display="none";
},10000);

})
.catch(err=>{

console.log(err);

scanLock=false;

});

}



// ================= PADAM SCAN =================

document.getElementById("padamBtn").onclick=function(){

fetch(SCRIPT_URL+"?mode=delete&id="+lastScanID)
.then(r=>r.json())
.then(data=>{

document.getElementById("notif").innerHTML="Scan dipadam";

document.getElementById("padamBtn").style.display="none";

});

}



// ================= START CAMERA =================

const html5QrCode=new Html5Qrcode("reader");

html5QrCode.start(

{ facingMode:"environment" },

{
fps:10,
qrbox:250
},

onScanSuccess

);

</script>

</body>
</html>

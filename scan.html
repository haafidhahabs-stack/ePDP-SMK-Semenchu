<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi e-PDP SMK Semenchu</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
}

.header{
background:#1b5e20;
color:white;
text-align:center;
padding:15px;
font-size:18px;
}

.container{
padding:15px;
}

select{
width:100%;
padding:10px;
font-size:16px;
margin-top:10px;
}

#reader{
margin-top:15px;
}

.success{
background:#4caf50;
color:white;
padding:12px;
text-align:center;
display:none;
margin-top:10px;
border-radius:6px;
}

button{
margin-top:10px;
padding:10px;
width:100%;
font-size:16px;
}

.radio{
margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
Aplikasi e-PDP SMK Semenchu
</div>

<div class="container">

<select id="namaGuru">
<option value="">-- Pilih Nama Guru --</option>
</select>

<br>

<label>
<input type="checkbox" id="modGantian">
Mod Gantian (Pilih Masa Manual)
</label>

<div class="radio">

<label><input type="radio" name="masa" value="1" checked>30 min</label>
<label><input type="radio" name="masa" value="2">60 min</label>
<label><input type="radio" name="masa" value="3">90 min</label>

</div>

<div id="reader"></div>

<div id="notif" class="success"></div>

<button id="padamBtn" style="display:none;">Padam Scan Ini</button>

</div>

<script>

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwNhDgO6VCUC3Vb2JmJZtFVdQfhNtIMGdseFcpsKZhzF1GOUo04f3mxAYne40RZZCjJNQ/exec";

let lastScan="";
let lastScanTime=0;
let lastScanID="";


// ================= LOAD GURU =================

async function loadGuru(){

const response=await fetch(SCRIPT_URL+"?mode=guru");
const data=await response.json();

const select=document.getElementById("namaGuru");

select.innerHTML='<option value="">-- Pilih Nama Guru --</option>';

data.guru.forEach(function(nama){

const option=document.createElement("option");
option.value=nama;
option.textContent=nama;

select.appendChild(option);

});

}

window.onload=loadGuru;


// ================= SLOT PERDANA =================

function getSlotPerdana(){

const now=new Date();

let start=new Date();

start.setHours(7);
start.setMinutes(30);
start.setSeconds(0);

let diff=(now-start)/60000;

let slot=Math.floor(diff/30)+1;

if(slot<1) slot=1;
if(slot>15) slot=15;

return slot;

}


// ================= SLOT PPKI =================

function getSlotPPKI(){

const jadual=[

"07:20","07:50","08:20","08:50",
"09:20","09:50","10:20","10:50",
"11:20","11:50","12:20","12:50",
"13:20","13:50"

];

const now=new Date();

let current=now.getHours()*60+now.getMinutes();

let slot=1;

for(let i=0;i<jadual.length;i++){

let t=jadual[i].split(":");

let min=parseInt(t[0])*60+parseInt(t[1]);

if(current>=min){

slot=i+1;

}

}

return slot;

}


// ================= SCAN SUCCESS =================

function onScanSuccess(decodedText){

let now=Date.now();

if(decodedText===lastScan && (now-lastScanTime)<3000){
return;
}

lastScan=decodedText;
lastScanTime=now;


const guru=document.getElementById("namaGuru").value;

if(!guru){

alert("Sila pilih nama guru dahulu");

return;

}


let kelas=decodedText;
let jenis="";

if(decodedText.includes("RELIF")){

jenis="RELIF";
kelas=decodedText.replace("RELIF|","");

}


// detect PPKI

let slot=0;

if(kelas.includes("PPKI")){

slot=getSlotPPKI();

}else{

slot=getSlotPerdana();

}


let bil=parseInt(document.querySelector('input[name="masa"]:checked').value);


const payload={

guru:guru,
kelas:kelas,
slot:slot,
bil:bil,
jenis:jenis

};


fetch(SCRIPT_URL,{

method:"POST",
body:JSON.stringify(payload)

})
.then(res=>res.json())
.then(data=>{


if(data.conflict){

alert("⚠ Konflik\nGuru "+data.guru+" telah scan untuk kelas "+kelas);
return;

}


lastScanID=data.id;


document.getElementById("notif").innerHTML=

"✔ BERJAYA SCAN<br><br>"+
"Guru : "+guru+"<br>"+
"Kelas : "+kelas+"<br>"+
"Slot : "+slot;


document.getElementById("notif").style.display="block";

document.getElementById("padamBtn").style.display="block";


if(navigator.vibrate){

navigator.vibrate(200);

}


setTimeout(function(){

document.getElementById("padamBtn").style.display="none";

},10000);


})
.catch(err=>console.log(err));

}



// ================= PADAM SCAN =================

document.getElementById("padamBtn").onclick=function(){

fetch(SCRIPT_URL+"?mode=delete&id="+lastScanID)
.then(r=>r.json())
.then(data=>{

document.getElementById("notif").innerHTML="Scan dipadam";

document.getElementById("padamBtn").style.display="none";

});

}



// ================= START CAMERA =================

const html5QrCode=new Html5Qrcode("reader");

html5QrCode.start(

{ facingMode:"environment" },

{
fps:10,
qrbox:250
},

onScanSuccess

);

</script>

</body>
</html>

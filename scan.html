<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwNhDgO6VCUC3Vb2JmJZtFVdQfhNtIMGdseFcpsKZhzF1GOUo04f3mxAYne40RZZCjJNQ/exec";

let scanner;

/* ===== AUTO SLOT ===== */
function autoSlot(){
  const now = new Date();
  const start = 7*60+30;
  const total = now.getHours()*60 + now.getMinutes();
  let slot = Math.floor((total-start)/30)+1;
  if(slot<1) slot=1;
  if(slot>15) slot=15;
  return slot;
}

/* ===== SUCCESS SCAN ===== */
function onScanSuccess(text){

  const guru=document.getElementById("guru").value;
  if(!guru){
    alert("Pilih nama guru dahulu");
    return;
  }

  const bil=document.querySelector('input[name="durasi"]:checked').value;
  const gantian=document.getElementById("gantian").checked;

  const data={
    kelas:text,
    slot:autoSlot(),
    bil:parseInt(bil),
    jenis:gantian?"GANTIAN":""
  };

  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify(data)
  })
  .then(r=>r.json())
  .then(()=>{
      navigator.vibrate?.(200);
      document.body.classList.add("success");
      setTimeout(()=>document.body.classList.remove("success"),500);
  });
}

/* ===== START CAMERA (ULTRA STABLE) ===== */
async function startScanner(){

  scanner = new Html5Qrcode("reader");

  const devices = await Html5Qrcode.getCameras();

  if(!devices.length){
    alert("Tiada kamera dijumpai");
    return;
  }

  /* pilih kamera belakang */
  let back = devices.find(d =>
      d.label.toLowerCase().includes("back") ||
      d.label.toLowerCase().includes("rear")
  );

  const cameraId = back ? back.id : devices[0].id;

  scanner.start(
    cameraId,
    {
      fps:10,
      qrbox:(w,h)=>{
        const size=Math.min(w,h);
        return size*0.75;
      }
    },
    onScanSuccess
  );
}

/* ===== AUTO START ===== */
document.addEventListener("DOMContentLoaded", startScanner);

</script>

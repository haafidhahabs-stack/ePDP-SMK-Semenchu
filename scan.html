<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aplikasi e-PDP SMK Semenchu</title>

<script src="html5-qrcode.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#d9f4e0;
}

.header{
background:#1b5e20;
color:white;
text-align:center;
padding:12px;
font-weight:bold;
}

.controls{
background:white;
padding:10px;
}

select{
width:100%;
padding:10px;
font-size:15px;
margin-bottom:8px;
}

#reader{
height:65vh;
}

.successBox{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#2e7d32;
color:white;
padding:18px;
border-radius:10px;
font-size:18px;
display:none;
z-index:999;
}
</style>
</head>

<body>

<div class="header">
Aplikasi e-PDP SMK Semenchu
</div>

<div class="controls">

<select id="guru">
<option value="">Memuatkan nama guru...</option>
</select>

<label>
<input type="checkbox" id="gantian">
Mod Gantian (Pilih Masa Manual)
</label>

<br><br>

<label><input type="radio" name="bil" value="1" checked>30 min</label>
<label><input type="radio" name="bil" value="2">60 min</label>
<label><input type="radio" name="bil" value="3">90 min</label>

</div>

<div id="reader"></div>

<div id="popup" class="successBox">
✅ Berjaya Scan
</div>

<script>

/* =========================
   URL GOOGLE SCRIPT
========================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwNhDgO6VCUC3Vb2JmJZtFVdQfhNtIMGdseFcpsKZhzF1GOUo04f3mxAYne40RZZCjJNQ/exec";


/* =========================
   LOAD NAMA GURU DARI SHEET
========================= */

fetch(API_URL+"?mode=guru")
.then(r=>r.json())
.then(list=>{
let select=document.getElementById("guru");
select.innerHTML='<option value="">-- Pilih Nama Guru --</option>';

list.forEach(n=>{
let opt=document.createElement("option");
opt.value=n;
opt.textContent=n;
select.appendChild(opt);
});
});


/* =========================
   SCANNER ENGINE
========================= */

let html5QrCode;
let lastScan="";
let scanLock=false;

function showPopup(){
let p=document.getElementById("popup");
p.style.display="block";
setTimeout(()=>p.style.display="none",1200);
}

function autoSlot(){

let now=new Date();
let start=7*60+20;
let current=now.getHours()*60+now.getMinutes();

let slot=Math.floor((current-start)/30)+1;

if(slot<1) slot=1;
if(slot>13) slot=13;

return slot;
}


/* ===== SUCCESS SCAN ===== */

function onScanSuccess(decodedText){

if(scanLock) return;
scanLock=true;

if(decodedText===lastScan){
scanLock=false;
return;
}

lastScan=decodedText;

/* vibration */
if(navigator.vibrate) navigator.vibrate(200);

showPopup();

/* ================= DATA ================= */

let guru=document.getElementById("guru").value;
if(!guru){
alert("Sila pilih nama guru dahulu");
scanLock=false;
return;
}

let bil=document.querySelector('input[name="bil"]:checked').value;
let gantian=document.getElementById("gantian").checked?"GANTIAN":"";

let kelas=decodedText;

let slot=document.getElementById("gantian").checked
? ""
: autoSlot();

/* SEND DATA */

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
guru:guru,
kelas:kelas,
slot:slot,
bil:bil,
jenis:gantian
})
});

setTimeout(()=>{
scanLock=false;
},2000);

}


/* WAJIB ADA — kalau tak scan tak trigger */
function onScanError(err){}


/* =========================
   START CAMERA
========================= */

async function startScanner(){

const cameras=await Html5Qrcode.getCameras();

if(!cameras.length){
alert("Tiada kamera dijumpai");
return;
}

/* pilih kamera belakang */
let back=cameras.find(c=>
c.label.toLowerCase().includes("back")||
c.label.toLowerCase().includes("rear")
);

let camId=back?back.id:cameras[0].id;

html5QrCode=new Html5Qrcode("reader");

html5QrCode.start(
camId,
{
fps:10,
qrbox:(w,h)=>{
let min=Math.min(w,h);
return Math.floor(min*0.75);
}
},
onScanSuccess,
onScanError
);

}

startScanner();

</script>

</body>
</html>

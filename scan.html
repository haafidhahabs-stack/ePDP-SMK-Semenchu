<!DOCTYPE html>
<html lang="ms">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Aplikasi e-PDP SMK Semenchu</title>

<script src="html5-qrcode.min.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
height:100%;
font-family:Poppins,sans-serif;
background:#d9f4e0;
overflow:hidden;
}

.container{
display:flex;
flex-direction:column;
height:100%;
}

.header{
background:#1b5e20;
color:white;
text-align:center;
padding:12px;
font-weight:bold;
font-size:18px;
}

.controls{
background:white;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
}

select{
padding:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

.options{
font-size:14px;
}

#reader{
flex:1;
width:100%;
}

.success{
background:#2e7d32!important;
}

.small{
font-size:12px;
color:#666;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
Aplikasi e-PDP SMK Semenchu
</div>

<div class="controls">

<select id="guru"></select>

<label>
<input type="checkbox" id="gantian">
Mod Gantian (Pilih Masa Manual)
</label>

<div id="masaManual" style="display:none">

<label><input type="radio" name="durasi" value="1" checked> 30 min</label>
<label><input type="radio" name="durasi" value="2"> 60 min</label>
<label><input type="radio" name="durasi" value="3"> 90 min</label>

<div class="small">Digunakan jika terlupa scan</div>

</div>

</div>

<div id="reader"></div>

</div>

<script>

/* =========================
   SETTINGS
========================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwNhDgO6VCUC3Vb2JmJZtFVdQfhNtIMGdseFcpsKZhzF1GOUo04f3mxAYne40RZZCjJNQ/exec";


/* =========================
   GURU AUTO LOAD
========================= */

const guruList = [
"Haafidhah Binti Abu Bakar Sidek",
"Siti Sanisah Binti Samian",
"Hj. Amad Bahri Bin Mardi",
"Mohd Jamil Bin Saleh @ Japri"
];

const guruSelect=document.getElementById("guru");

guruList.forEach(n=>{
let opt=document.createElement("option");
opt.value=n;
opt.textContent=n.toUpperCase();
guruSelect.appendChild(opt);
});


/* =========================
   MOD GANTIAN UI
========================= */

document.getElementById("gantian")
.addEventListener("change",e=>{
document.getElementById("masaManual")
.style.display=e.target.checked?"block":"none";
});


/* =========================
   AUTO SLOT
========================= */

function autoDetectSlot(){

const now=new Date();
const total=now.getHours()*60+now.getMinutes();

const start=7*60+20; // 7:20 pagi
let slot=Math.floor((total-start)/30)+1;

if(slot<1)slot=1;
if(slot>13)slot=13;

return slot;
}


/* =========================
   SCAN SUCCESS
========================= */

function onScanSuccess(qrMessage){

const guru=guruSelect.value;

if(!guru){
alert("Sila pilih nama guru");
return;
}

const gantian=document.getElementById("gantian").checked;

let bil,slot,jenis="";

if(gantian){
bil=document.querySelector('input[name="durasi"]:checked').value;
slot="MANUAL";
jenis="GANTIAN";
}else{
bil=1;
slot=autoDetectSlot();
}

fetch(API_URL,{
method:"POST",
body:JSON.stringify({
kelas:qrMessage,
guru:guru,
slot:slot,
bil:parseInt(bil),
jenis:jenis
})
})
.then(r=>r.json())
.then(res=>{

if(res.ok){

navigator.vibrate(200);

document.body.classList.add("success");

setTimeout(()=>{
document.body.classList.remove("success");
},500);

}

});

}


/* =========================
   START CAMERA (STABIL)
========================= */

let html5QrCode;

async function startCamera(){

const cameras=await Html5Qrcode.getCameras();

if(!cameras.length){
alert("Kamera tidak dijumpai");
return;
}

/* auto pilih kamera belakang */
let back=cameras.find(c=>
c.label.toLowerCase().includes("back")||
c.label.toLowerCase().includes("rear")
);

const camId=back?back.id:cameras[0].id;

html5QrCode=new Html5Qrcode("reader");

html5QrCode.start(
camId,
{
fps:10,
qrbox:{width:250,height:250},
aspectRatio:1.0
},
onScanSuccess,
()=>{}
);

}

document.addEventListener("DOMContentLoaded",startCamera);

</script>

</body>
</html>
